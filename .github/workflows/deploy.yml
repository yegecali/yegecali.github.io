name: Build and publish portfolio

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: |
          test -s dist/index.html
          test -d dist/assets
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { resolve } from 'node:path'
          const data = JSON.parse(readFileSync('src/data/portfolio.json', 'utf8'))
          const pdf = readFileSync(resolve('dist', data.profile.cv.path))
          if (pdf.length < 1000 || pdf.subarray(0, 5).toString() !== '%PDF-') {
            throw new Error('Missing or invalid generated CV in the Pages build')
          }
          NODE
          grep -q 'https://yegecali.github.io/' dist/index.html
      - name: Publish generated static files to main and master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -a dist "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
          for branch in main master; do
            git fetch origin "$branch"
            git worktree add --detach "$RUNNER_TEMP/publish-$branch" "origin/$branch"
            cd "$RUNNER_TEMP/publish-$branch"
            git rm -rq --ignore-unmatch .
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$RUNNER_TEMP/site/." .
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "deploy: portfolio from $GITHUB_SHA"
              git push origin "HEAD:$branch"
            fi
            cd "$GITHUB_WORKSPACE"
          done
      - name: Request GitHub Pages build from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status, url}'
