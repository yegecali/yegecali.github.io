name: Build and publish portfolio

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q 'https://yegecali.github.io/' dist/index.html
      - name: Publish generated static files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -a dist "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/publish" origin/main
          cd "$RUNNER_TEMP/publish"
          git rm -rq --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/site/." .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: portfolio from $GITHUB_SHA"
            git push origin HEAD:main
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
