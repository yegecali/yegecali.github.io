name: One-time portfolio migration

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import source from original repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git clone --depth 1 --branch gp-portfolio-build https://github.com/yegecali/yegecali.git "$RUNNER_TEMP/old"
          git fetch origin develop main
          git checkout -B develop origin/develop
          cp -a "$RUNNER_TEMP/old/portfolio/." .
          node - <<'NODE'
          const fs = require('fs');
          const file = 'src/data/portfolio.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.metadata.siteUrl = 'https://yegecali.github.io/';
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\\n');
          const readme = fs.readFileSync('README.md', 'utf8').replaceAll('https://yegecali.github.io/yegecali/', 'https://yegecali.github.io/').replaceAll('La base de Vite continúa siendo `/yegecali/`', 'La base de Vite es `/`');
          fs.writeFileSync('README.md', readme);
          NODE
          git add -A
          git commit -m 'feat: migrate React portfolio and set root URL'
          git push origin develop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish static output to main
        shell: bash
        run: |
          set -euo pipefail
          cp -a dist "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"
          git worktree add --detach "$RUNNER_TEMP/publish" origin/main
          cd "$RUNNER_TEMP/publish"
          git rm -rq --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/site/." .
          git add -A
          git commit -m 'deploy: initial root portfolio'
          git push origin HEAD:main
